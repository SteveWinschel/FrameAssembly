name: Release Binaries

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v3.0.0)'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # Statically link the MSVC C runtime so Windows .exe files need no VC++ Redistributable
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
  CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'

jobs:
  prepare:
    name: Prepare Tag & Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and tag
        id: resolve
        run: |
          ROOT_VERSION=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="$ROOT_VERSION"
            TAG="v$VERSION"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release TAG=$TAG, VERSION=$VERSION (root Cargo.toml=$ROOT_VERSION)"

          # When triggered by push to main or branch, auto-create and push tag if not already existing
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            git fetch --tags origin || true
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
              echo "Git tag $TAG already exists; skipping tag creation."
            else
              echo "Creating and pushing git tag $TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

  build:
    name: Build (${{ matrix.bundle_name }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            bundle_name: frameassembly-linux-x64
            os: ubuntu-24.04
            archive: tar.gz
            ext: ''
            run_tests: false
          - target: aarch64-unknown-linux-musl
            bundle_name: frameassembly-linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            ext: ''
            run_tests: false
          - target: x86_64-pc-windows-msvc
            bundle_name: frameassembly-windows-x64
            os: windows-2025
            archive: zip
            ext: '.exe'
            run_tests: false
          - target: aarch64-pc-windows-msvc
            bundle_name: frameassembly-windows-arm64
            os: windows-2025
            archive: zip
            ext: '.exe'
            run_tests: false
          - target: aarch64-apple-darwin
            bundle_name: frameassembly-macos-arm64
            os: macos-15
            archive: tar.gz
            ext: ''
            run_tests: false
          - target: x86_64-apple-darwin
            bundle_name: frameassembly-macos-x64
            os: macos-15
            archive: tar.gz
            ext: ''
            run_tests: false

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify git tag matches Cargo.toml version
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "frameassembly") | .version')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag version ($EXPECTED) does not match Cargo.toml version ($ACTUAL)"
            exit 1
          fi

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          LOCKED_FLAG=""
          if [ -f Cargo.lock ]; then
            LOCKED_FLAG="--locked"
          fi
          cargo build --release $LOCKED_FLAG --bin frameassembly --target "${{ matrix.target }}"

      - name: Stage release bundle
        id: stage
        run: |
          STAGE="${{ matrix.bundle_name }}"
          mkdir -p "$STAGE"

          cp "target/${{ matrix.target }}/release/frameassembly${{ matrix.ext }}" "$STAGE/"
          [ -f README.md ] && cp README.md "$STAGE/"

          shopt -s nullglob
          for lic in LICENSE* COPYING*; do
            cp "$lic" "$STAGE/"
          done

          cat <<'EOF' > "$STAGE/quickstart.frasm"
          // FrameAssembly 3.0 Quickstart
          // Preview ladder: frameassembly show quickstart.frasm
          // Compile PCAP:   frameassembly quickstart.frasm quickstart.pcap

          host client { ip 10.0.0.10 mac 00:11:22:33:44:55 }
          host server { ip 10.0.0.20 mac aa:bb:cc:dd:ee:ff }

          compile {
              client -> server tcp syn srcport 51234 dstport 80 win 65535 mss 1460 wait 1ms
              client <- server tcp syn ack win 65535 mss 1460 wait 1ms
              client -> server tcp ack wait 1ms
              client -> server http get uri "/healthz" hosthdr "api.example.com" wait 2ms
              client <- server http status 200 reason "OK" body "ok"
          }
          EOF

          if [ "${{ runner.os }}" = "Linux" ]; then
            [ -f contrib/mime/text-vnd.frameassembly.xml ] && cp contrib/mime/text-vnd.frameassembly.xml "$STAGE/"
            [ -f contrib/magic/frameassembly.magic ] && cp contrib/magic/frameassembly.magic "$STAGE/"
          fi
          [ -d contrib/completions ] && cp -r contrib/completions "$STAGE/completions"

          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Package .tar.gz archive (Linux & macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czf "${{ steps.stage.outputs.stage_dir }}.tar.gz" "${{ steps.stage.outputs.stage_dir }}"

      - name: Package .zip archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.stage.outputs.stage_dir }}" -DestinationPath "${{ steps.stage.outputs.stage_dir }}.zip" -Force

      - name: Build Debian .deb package with shell completions (Linux)
        id: deb
        if: runner.os == 'Linux'
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          ARCH="amd64"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            ARCH="arm64"
          fi
          mkdir -p deb-dist
          chmod +x contrib/packaging/apt/build-deb.sh
          ./contrib/packaging/apt/build-deb.sh "${TAG}" "target/${{ matrix.target }}/release/frameassembly" "${ARCH}" deb-dist
          cp -f deb-dist/frameassembly_*_${ARCH}.deb "deb-dist/frameassembly_${ARCH}.deb"
          DEB_CONTENTS="$(dpkg-deb --contents "deb-dist/frameassembly_${ARCH}.deb")"
          for comp_entry in \
            "/usr/share/bash-completion/completions/frameassembly" \
            "/usr/share/zsh/vendor-completions/_frameassembly" \
            "/usr/share/fish/vendor_completions.d/frameassembly.fish"; do
            if ! grep -Fq "${comp_entry#/}" <<< "$DEB_CONTENTS"; then
              echo "::error::Debian package missing expected completion path: ${comp_entry}"
              exit 1
            fi
          done
          echo "deb_file=deb-dist/frameassembly_${ARCH}.deb" >> "$GITHUB_OUTPUT"

      - name: Upload built archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.bundle_name }}
          path: ${{ steps.stage.outputs.stage_dir }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 5

      - name: Upload Debian .deb package (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-deb-${{ matrix.bundle_name }}
          path: ${{ steps.deb.outputs.deb_file }}
          if-no-files-found: error
          retention-days: 5

  wasm:
    name: Build & Package WebAssembly (NPM)
    needs: [prepare]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Sync version across Cargo.toml, WASM, and VS Code
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Syncing version $VERSION into WASM Cargo.toml, WASM package.json, and VS Code package.json..."
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" frameassembly-wasm/Cargo.toml
          sed -i -E "s/frameassembly = \{ path = \"\.\.\", version = \".*\" \}/frameassembly = { path = \"..\", version = \"$VERSION\" }/" frameassembly-wasm/Cargo.toml
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" frameassembly-wasm/package.json
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" frameassembly-vscode/package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Build WebAssembly package
        working-directory: frameassembly-wasm
        run: |
          wasm-pack build --release --target web
          (
            cd pkg
            node -e '
              const fs = require("fs");
              const src = JSON.parse(fs.readFileSync("../package.json", "utf8"));
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const field of ["keywords", "description", "homepage", "license", "repository"]) {
                if (src[field] !== undefined) {
                  pkg[field] = src[field];
                }
              }
              pkg.repository = pkg.repository || {
                type: "git",
                url: "git+https://github.com/SteveWinschel/FrameAssembly.git"
              };
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            '
          )

      - name: Package WASM tarball
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          tar -czf "frameassembly-wasm-${TAG}.tar.gz" -C frameassembly-wasm pkg

      - name: Upload WASM archive
        uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: frameassembly-wasm-*.tar.gz
          if-no-files-found: error
          retention-days: 5

      - name: Publish to NPM Registry via Token (Optional)
        id: npm_token_publish
        if: ${{ env.NPM_TOKEN != '' }}
        continue-on-error: true
        working-directory: frameassembly-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          npm publish --provenance --access public

      - name: Publish to NPM Registry via OIDC Trusted Publisher
        if: ${{ env.NPM_TOKEN == '' || steps.npm_token_publish.outcome == 'failure' }}
        continue-on-error: true
        working-directory: frameassembly-wasm/pkg
        run: |
          npm install -g npm@latest
          rm -f ~/.npmrc "$NPM_CONFIG_USERCONFIG"
          unset NPM_TOKEN NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish --provenance --access public

  vscode-extension:
    name: Package & Publish VS Code Extension (.vsix)
    needs: [prepare, wasm]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release-wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: release-wasm
          path: wasm-artifact

      - name: Bundle WASM runtime into frameassembly-vscode/wasm
        run: |
          mkdir -p wasm-extract frameassembly-vscode/wasm
          tar -xzf wasm-artifact/frameassembly-wasm-*.tar.gz -C wasm-extract
          cp -f wasm-extract/pkg/frameassembly_wasm.js \
                wasm-extract/pkg/frameassembly_wasm_bg.wasm \
                wasm-extract/pkg/frameassembly_wasm.d.ts \
                frameassembly-vscode/wasm/
          rm -rf wasm-artifact wasm-extract

      - name: Sync version in package.json
        working-directory: frameassembly-vscode
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i -E "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        working-directory: frameassembly-vscode
        run: |
          rm -f frameassembly-vscode-*.vsix frameassembly-vscode.vsix
          npx --yes @vscode/vsce package --no-git-tag-version --no-update-package-json -o "frameassembly-vscode.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: frameassembly-vscode/frameassembly-vscode.vsix
          if-no-files-found: error
          retention-days: 5

      - name: Publish to Visual Studio Marketplace via PAT (Optional)
        id: vsce_pat_publish
        if: ${{ env.VSCE_PAT != '' }}
        continue-on-error: true
        working-directory: frameassembly-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npx --yes @vscode/vsce@latest publish -p "${{ secrets.VSCE_PAT }}" --packagePath "frameassembly-vscode.vsix"

      - name: Publish to Visual Studio Marketplace via OIDC Trusted Publisher
        if: ${{ env.VSCE_PAT == '' || steps.vsce_pat_publish.outcome == 'failure' }}
        continue-on-error: true
        working-directory: frameassembly-vscode
        run: |
          unset VSCE_PAT
          npx --yes @vscode/vsce@latest publish --oidc --packagePath "frameassembly-vscode.vsix"

  publish:
    name: Checksum, Attest & Publish Release
    needs: [prepare, build, wasm, vscode-extension]
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all target archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare final 10 release assets in dist
        run: |
          mkdir -p dist
          rm -f dist/frameassembly-wasm-*.tar.gz
          if [ ! -f dist/frameassembly-vscode.vsix ]; then
            VERSION="${{ needs.prepare.outputs.version }}"
            if [ -f "frameassembly-vscode/frameassembly-vscode-${VERSION}.vsix" ]; then
              cp "frameassembly-vscode/frameassembly-vscode-${VERSION}.vsix" dist/frameassembly-vscode.vsix
            elif [ -f frameassembly-vscode/frameassembly-vscode.vsix ]; then
              cp frameassembly-vscode/frameassembly-vscode.vsix dist/frameassembly-vscode.vsix
            fi
          fi
          ls -la dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          FILES=( *.tar.gz *.zip *.deb *.vsix )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No release archives found in dist/"
            exit 1
          fi
          sha256sum "${FILES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate GitHub SLSA build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: FrameAssembly ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          body: |
            ## Download by Operating System

            | Operating System | Architecture | Direct Download | Quick Install |
            | :--- | :--- | :--- | :--- |
            | **Windows** | x64 (`x86_64`) | [`frameassembly-windows-x64.zip`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-windows-x64.zip) | `irm https://raw.githubusercontent.com/SteveWinschel/FrameAssembly/main/install.ps1 \| iex` |
            | **Windows** | ARM64 | [`frameassembly-windows-arm64.zip`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-windows-arm64.zip) | `scoop bucket add frameassembly https://github.com/SteveWinschel/homebrew-tap-FrameAssembly && scoop install frameassembly` |
            | **macOS** | Apple Silicon (`arm64`) | [`frameassembly-macos-arm64.tar.gz`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-macos-arm64.tar.gz) | `brew install SteveWinschel/tap-FrameAssembly/frameassembly` |
            | **macOS** | Intel (`x64`) | [`frameassembly-macos-x64.tar.gz`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-macos-x64.tar.gz) | `curl -fsSL https://raw.githubusercontent.com/SteveWinschel/FrameAssembly/main/install.sh \| sh` |
            | **Linux (Debian / Ubuntu)** | `amd64` / `arm64` | [`frameassembly_amd64.deb`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly_amd64.deb) · [`frameassembly_arm64.deb`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly_arm64.deb) | `curl -fsSLo /tmp/frameassembly.deb https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly_amd64.deb && sudo apt install -y /tmp/frameassembly.deb` |
            | **Linux (Static `musl`)** | `x64` / `arm64` | [`frameassembly-linux-x64.tar.gz`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-linux-x64.tar.gz) · [`frameassembly-linux-arm64.tar.gz`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-linux-arm64.tar.gz) | `curl -fsSL https://raw.githubusercontent.com/SteveWinschel/FrameAssembly/main/install.sh \| sh` |
            | **VS Code / Cursor / VSCodium** | Universal | [`frameassembly-vscode.vsix`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/frameassembly-vscode.vsix) | `code --install-extension SteveWinschel.frameassembly-vscode` |

            Verify every archive against [`SHA256SUMS.txt`](https://github.com/SteveWinschel/FrameAssembly/releases/download/${{ needs.prepare.outputs.tag }}/SHA256SUMS.txt), or run FrameAssembly directly in your browser at [`frameassembly.ai.studio`](https://frameassembly.ai.studio/).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.vsix
            dist/SHA256SUMS.txt

      - name: Install Rust stable for Crates.io publish
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io (Optional)
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Auto-sync manifest checksums
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if [ -f dist/SHA256SUMS.txt ]; then
            ./contrib/packaging/update-checksums.sh --sums-file dist/SHA256SUMS.txt "$TAG"
          else
            ./contrib/packaging/update-checksums.sh "$TAG"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contrib/packaging/
          if ! git diff --cached --quiet; then
            git commit -m "chore(packaging): auto-sync release $TAG checksums [skip ci]"
            git push origin main || true
          fi

      - name: Trigger Homebrew Tap and Scoop Bucket Sync (Optional)
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Syncing Homebrew tap formula and Scoop bucket manifest for FrameAssembly $VERSION ($TAG)..."
          # Sync Homebrew tap and Scoop bucket with 4-repo fallback
          TAP_SYNCED=0
          for TAP_REPO in homebrew-tap-FrameAssembly homebrew-tap homebrew-frameassembly tap-FrameAssembly; do
            echo "Attempting Homebrew tap sync to SteveWinschel/${TAP_REPO}..."
            rm -rf tap-repo
            if git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/SteveWinschel/${TAP_REPO}.git" tap-repo 2>/dev/null; then
              mkdir -p tap-repo/Formula tap-repo/bucket
              cp contrib/packaging/homebrew/Formula/frameassembly.rb tap-repo/Formula/
              cp contrib/packaging/scoop/frameassembly.json tap-repo/bucket/
              cd tap-repo
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add Formula/frameassembly.rb bucket/frameassembly.json
              if ! git diff --cached --quiet; then
                git commit -m "frameassembly $VERSION"
                git push origin main || true
              fi
              cd ..
              TAP_SYNCED=1
              echo "Successfully synced Formula/frameassembly.rb and bucket/frameassembly.json to SteveWinschel/${TAP_REPO}."
              break
            fi
          done
          if [ "$TAP_SYNCED" -eq 0 ]; then
            echo "::warning::Could not clone homebrew-tap-FrameAssembly, homebrew-tap, homebrew-frameassembly, or tap-FrameAssembly; tap sync skipped."
          fi
