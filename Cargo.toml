[package]
name = "frameassembly"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
description = "Deterministic network packet crafting DSL and compiler synthesizing nanosecond-accurate PCAPNG captures across 81 L2-L7 protocols (Ethernet, VLAN, MPLS, ARP, IPv4, IPv6, ICMP, BGP, OSPF, WireGuard, IPsec, TCP, UDP, SCTP, DNS, HTTP/2, gRPC, TLS, QUIC, SNMPv3 USM, Modbus, DNP3, S7comm, OPC UA)."
authors = ["Steve Winschel"]
license = "MIT"
documentation = "https://docs.rs/frameassembly"
homepage = "https://github.com/SteveWinschel/FrameAssembly"
repository = "https://github.com/SteveWinschel/FrameAssembly"
keywords = ["pcap", "networking", "dsl", "packet-crafting", "security"]
categories = [
    "network-programming",
    "compilers",
    "command-line-utilities",
    "simulation",
    "development-tools::testing",
]
readme = "README.md"
exclude = [
    "frameassembly-vscode/",
    "llms.txt",
    "llms-full.txt",
    "docs/",
    "examples/",
    "grammar.ebnf",
    "frameassembly.gbnf",
    "frameassembly.lark",
    "AGENTS.md",
    "CLAUDE.md",
    "CITATION.cff",
    "codemeta.json",
    "context7.json",
    "demo.fasm",
    "install.sh",
    "tests/",
    ".github/",
    ".agents/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aes = "0.9.3"
block-padding = "0.4.2"
cbc = "0.2.1"
cfb-mode = "0.9.1"
clap = "4.6.7"
des = "0.9.0"
hmac = "0.13.0"
logos = "0.14.3"
md-5 = "0.11.0"
miette = { version = "7.6.0", features = ["fancy"] }
pcap-file = "2.0.0"
rasn = "0.28.15"
rasn-smi = "0.28.15"
rasn-snmp = "0.28.15"
sha1 = "0.11.0"
sha2 = "0.11.0"
winnow = "1.0.4"

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true
panic = "abort"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
bare_urls = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
unescaped_backticks = "warn"

[lints.clippy]
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
incompatible_msrv = "allow"