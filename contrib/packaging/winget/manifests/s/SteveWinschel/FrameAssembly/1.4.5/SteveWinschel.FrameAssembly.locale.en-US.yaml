ShortDescription: Rootless Packets-as-Code DSL and compiler for deterministic PCAP/PCAPNG traffic synthesis.
Description: |-
  FrameAssembly is a Rust 2024 Domain-Specific Language (DSL) and optimizing compiler
  that compiles declarative .fasm network traffic specifications into deterministic,
  nanosecond-precision .pcap and .pcapng packet captures across 81 native Layer 2
  through Layer 7 protocols for Wireshark, tcpreplay, Suricata, and Zeek.
