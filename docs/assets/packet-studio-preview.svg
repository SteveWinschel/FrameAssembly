<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">VS Code Packet Studio: .frasm code beside a live packet ladder and hex dump</title>
  <desc id="d">Split view of the FrameAssembly VS Code extension. The left editor shows a highlighted .frasm file with a TCP handshake and an HTTP request. The right side shows the Live Packet Ladder table and a hex dump of the selected frame.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cccccc; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; }
      .ln { fill: #6e7681; font-size: 14px; text-anchor: end; }
      .kw { fill: #569cd6; } .fl { fill: #c586c0; } .pr { fill: #4ec9b0; }
      .md { fill: #9cdcfe; } .st { fill: #ce9178; } .nm { fill: #b5cea8; }
      .cm { fill: #6a9955; } .ar { fill: #f48771; font-weight: 700; } .pl { fill: #d4d4d4; }
      .th { fill: #9da5b4; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .td { fill: #d4d4d4; font-size: 13px; }
    </style>
  </defs>
  <!-- window -->
  <rect width="1200" height="640" rx="12" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="2"/>
  <rect width="1200" height="36" rx="12" fill="#323233"/>
  <rect y="24" width="1200" height="12" fill="#323233"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="600" y="23" text-anchor="middle" font-size="13">checkout_test.frasm — FrameAssembly Packet Studio — Visual Studio Code</text>

  <!-- tabs -->
  <rect x="0" y="36" width="1200" height="34" fill="#252526"/>
  <rect x="0" y="36" width="190" height="34" fill="#1e1e1e"/>
  <rect x="0" y="36" width="190" height="2" fill="#0ea5e9"/>
  <text x="16" y="58" font-size="13" style="fill:#ffffff">checkout_test.frasm</text>
  <rect x="610" y="36" width="250" height="34" fill="#1e1e1e"/>
  <rect x="610" y="36" width="250" height="2" fill="#0ea5e9"/>
  <text x="626" y="58" font-size="13" style="fill:#ffffff">Live Packet Ladder — checkout_test</text>
  <line x1="600" y1="36" x2="600" y2="620" stroke="#3c3c3c" stroke-width="2"/>

  <!-- editor (left) -->
  <rect x="0" y="70" width="600" height="550" fill="#1e1e1e"/>
  <g>
    <text x="40" y="102" class="ln m">1</text>  <text x="56" y="102" class="m cm">// Client opens a TCP session to the web server</text>
    <text x="40" y="126" class="ln m">2</text>  <text x="56" y="126" class="m"><tspan class="kw">host</tspan> <tspan class="md">client</tspan> <tspan class="pl">{</tspan> <tspan class="fl">ip</tspan> <tspan class="nm">10.0.0.10</tspan> <tspan class="fl">mac</tspan> <tspan class="nm">00:11:22:33:44:55</tspan> <tspan class="pl">}</tspan></text>
    <text x="40" y="150" class="ln m">3</text>  <text x="56" y="150" class="m"><tspan class="kw">host</tspan> <tspan class="md">web</tspan>    <tspan class="pl">{</tspan> <tspan class="fl">ip</tspan> <tspan class="nm">10.0.0.80</tspan> <tspan class="fl">mac</tspan> <tspan class="nm">aa:bb:cc:dd:ee:ff</tspan> <tspan class="pl">}</tspan></text>
    <text x="40" y="174" class="ln m">4</text>
    <text x="40" y="198" class="ln m">5</text>  <text x="56" y="198" class="m"><tspan class="kw">compile</tspan> <tspan class="pl">{</tspan></text>
    <text x="40" y="222" class="ln m">6</text>  <text x="56" y="222" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">syn</tspan> <tspan class="fl">srcport</tspan> <tspan class="nm">51234</tspan> <tspan class="fl">dstport</tspan> <tspan class="nm">80</tspan></text>
    <text x="40" y="246" class="ln m">7</text>  <text x="56" y="246" class="m pl">        <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="40" y="270" class="ln m">8</text>  <text x="56" y="270" class="m pl">    client <tspan class="ar">&lt;-</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">syn</tspan> <tspan class="fl">ack</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="40" y="294" class="ln m">9</text>  <text x="56" y="294" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">ack</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="40" y="318" class="ln m">10</text> <text x="56" y="318" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">http</tspan> <tspan class="fl">get</tspan> <tspan class="fl">uri</tspan> <tspan class="st">"/healthz"</tspan></text>
    <text x="40" y="342" class="ln m">11</text> <text x="56" y="342" class="m pl">        <tspan class="fl">hosthdr</tspan> <tspan class="st">"shop.example.com"</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">2ms</tspan></text>
    <text x="40" y="366" class="ln m">12</text> <text x="56" y="366" class="m pl">    client <tspan class="ar">&lt;-</tspan> web <tspan class="pr">http</tspan> <tspan class="fl">status</tspan> <tspan class="nm">200</tspan> <tspan class="fl">reason</tspan> <tspan class="st">"OK"</tspan></text>
    <text x="40" y="390" class="ln m">13</text> <text x="56" y="390" class="m pl">}</text>
  </g>
  <!-- diagnostic squiggle example -->
  <rect x="56" y="422" width="520" height="66" rx="6" fill="#2d2d30" stroke="#3c3c3c"/>
  <text x="70" y="446" font-size="13" style="fill:#4ade80;font-weight:700">✔ Compiled · 5 frames · 0 errors</text>
  <text x="70" y="468" font-size="13" style="fill:#9da5b4">Ctrl+Shift+P → "Compile .frasm to .pcap" · Quick Fix on typos</text>

  <!-- ladder (right) -->
  <rect x="601" y="70" width="599" height="550" fill="#1e1e1e"/>
  <text x="620" y="100" font-size="15" style="fill:#ffffff;font-weight:700">Live Packet Ladder</text>
  <text x="1180" y="100" text-anchor="end" font-size="12" style="fill:#4ade80">● updates as you type</text>
  <rect x="620" y="112" width="560" height="26" fill="#2d2d30"/>
  <text x="630" y="130" class="th">#</text><text x="660" y="130" class="th">TIME</text><text x="730" y="130" class="th">SOURCE → DEST</text><text x="880" y="130" class="th">PROTO</text><text x="945" y="130" class="th">SUMMARY</text>
  <g class="td">
    <text x="630" y="158">1</text><text x="660" y="158">0.000</text><text x="730" y="158">client → web</text><text x="880" y="158" style="fill:#4ec9b0">TCP</text><text x="945" y="158">51234 → 80 [SYN]</text>
    <text x="630" y="184">2</text><text x="660" y="184">1.000</text><text x="730" y="184">web → client</text><text x="880" y="184" style="fill:#4ec9b0">TCP</text><text x="945" y="184">80 → 51234 [SYN ACK]</text>
    <text x="630" y="210">3</text><text x="660" y="210">2.000</text><text x="730" y="210">client → web</text><text x="880" y="210" style="fill:#4ec9b0">TCP</text><text x="945" y="210">[ACK] seq=1001</text>
  </g>
  <rect x="620" y="220" width="560" height="26" fill="#094771"/>
  <g class="td" style="fill:#ffffff">
    <text x="630" y="238">4</text><text x="660" y="238">3.000</text><text x="730" y="238">client → web</text><text x="880" y="238" style="fill:#4ec9b0">HTTP</text><text x="945" y="238">GET /healthz</text>
  </g>
  <g class="td">
    <text x="630" y="264">5</text><text x="660" y="264">5.000</text><text x="730" y="264">web → client</text><text x="880" y="264" style="fill:#4ec9b0">HTTP</text><text x="945" y="264">200 OK</text>
  </g>

  <!-- hex dump -->
  <text x="620" y="312" font-size="15" style="fill:#ffffff;font-weight:700">Frame 4 · 102 bytes</text>
  <rect x="620" y="324" width="560" height="232" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <g class="m" style="font-size:13px">
    <text x="634" y="350" style="fill:#6e7681">0000</text><text x="690" y="350" style="fill:#d4d4d4">aa bb cc dd ee ff 00 11 22 33 44 55 08 00 45 00</text><text x="1010" y="350" style="fill:#9cdcfe">......."3DU..E.</text>
    <text x="634" y="374" style="fill:#6e7681">0010</text><text x="690" y="374" style="fill:#d4d4d4">00 58 00 01 00 00 40 06 66 47 0a 00 00 0a 0a 00</text><text x="1010" y="374" style="fill:#9cdcfe">.X....@.fG......</text>
    <text x="634" y="398" style="fill:#6e7681">0020</text><text x="690" y="398" style="fill:#d4d4d4">00 50 c8 22 00 50 00 00 03 e9 00 00 03 e9 50 18</text><text x="1010" y="398" style="fill:#9cdcfe">.P.".P........P.</text>
    <text x="634" y="422" style="fill:#6e7681">0030</text><text x="690" y="422" style="fill:#d4d4d4">ff ff 3a 91 00 00 47 45 54 20 2f 68 65 61 6c 74</text><text x="1010" y="422" style="fill:#9cdcfe">..:...GET /healt</text>
    <text x="634" y="446" style="fill:#6e7681">0040</text><text x="690" y="446" style="fill:#d4d4d4">68 7a 20 48 54 54 50 2f 31 2e 31 0d 0a 48 6f 73</text><text x="1010" y="446" style="fill:#9cdcfe">hz HTTP/1.1..Hos</text>
    <text x="634" y="470" style="fill:#6e7681">0050</text><text x="690" y="470" style="fill:#d4d4d4">74 3a 20 73 68 6f 70 2e 65 78 61 6d 70 6c 65 2e</text><text x="1010" y="470" style="fill:#9cdcfe">t: shop.example.</text>
  </g>
  <rect x="620" y="490" width="560" height="1" fill="#3c3c3c"/>
  <text x="634" y="516" font-size="13" style="fill:#9da5b4">Ethernet II · IPv4 10.0.0.10 → 10.0.0.80 · TCP 51234 → 80 [PSH ACK]</text>
  <text x="634" y="538" font-size="13" style="fill:#9da5b4">Checksums and sequence numbers calculated automatically</text>

  <!-- status bar -->
  <rect x="0" y="620" width="1200" height="20" rx="0" fill="#0ea5e9"/>
  <rect y="628" width="1200" height="12" rx="12" fill="#0ea5e9"/>
  <text x="14" y="635" font-size="11" style="fill:#ffffff">FrameAssembly 3.0 · .frasm</text>
  <text x="1186" y="635" text-anchor="end" font-size="11" style="fill:#ffffff">Right-click a .pcap → Reverse Capture to .frasm</text>
</svg>
