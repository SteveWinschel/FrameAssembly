<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">FrameAssembly 3.1 in VS Code: .frasm syntax highlighting, live inline diagnostics, 1-click Quick Fix, and CLI terminal output</title>
  <desc id="d">VS Code editor showing a .frasm file with syntax highlighting across host and compile blocks, a live inline error squiggle with a 1-click Quick Fix replacing 'sport' with 'srcport', and the integrated terminal compiling .pcap and .pcapng files via the frameassembly CLI.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cccccc; }
      .m { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; }
      .ln { fill: #6e7681; font-size: 14px; text-anchor: end; }
      .kw { fill: #569cd6; } .fl { fill: #c586c0; } .pr { fill: #4ec9b0; }
      .md { fill: #9cdcfe; } .st { fill: #ce9178; } .nm { fill: #b5cea8; }
      .cm { fill: #6a9955; } .ar { fill: #f48771; font-weight: 700; } .pl { fill: #d4d4d4; }
      .err { fill: #f87171; }
      .th { fill: #9da5b4; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    </style>
  </defs>

  <!-- outer VS Code window -->
  <rect width="1200" height="640" rx="12" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="2"/>
  <rect width="1200" height="36" rx="12" fill="#323233"/>
  <rect y="24" width="1200" height="12" fill="#323233"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="600" y="23" text-anchor="middle" font-size="13">checkout_test.frasm — FrameAssembly (.frasm) — Visual Studio Code</text>

  <!-- editor tab bar -->
  <rect x="0" y="36" width="1200" height="34" fill="#252526"/>
  <rect x="0" y="36" width="210" height="34" fill="#1e1e1e"/>
  <rect x="0" y="36" width="210" height="2" fill="#0ea5e9"/>
  <text x="18" y="58" font-size="13" style="fill:#ffffff">checkout_test.frasm</text>

  <!-- code editor pane -->
  <rect x="0" y="70" width="1200" height="340" fill="#1e1e1e"/>
  <!-- active error line highlight -->
  <rect x="48" y="198" width="580" height="24" fill="#2a1d1d" rx="3"/>
  <g>
    <text x="38" y="100" class="ln m">1</text>  <text x="56" y="100" class="m cm">// TCP 3-way handshake + HTTP health check (post-packet wait)</text>
    <text x="38" y="124" class="ln m">2</text>  <text x="56" y="124" class="m"><tspan class="kw">host</tspan> <tspan class="md">client</tspan> <tspan class="pl">{</tspan> <tspan class="fl">ip</tspan> <tspan class="nm">10.0.0.10</tspan> <tspan class="fl">mac</tspan> <tspan class="nm">00:11:22:33:44:55</tspan> <tspan class="pl">}</tspan></text>
    <text x="38" y="148" class="ln m">3</text>  <text x="56" y="148" class="m"><tspan class="kw">host</tspan> <tspan class="md">web</tspan>    <tspan class="pl">{</tspan> <tspan class="fl">ip</tspan> <tspan class="nm">10.0.0.80</tspan> <tspan class="fl">mac</tspan> <tspan class="nm">aa:bb:cc:dd:ee:ff</tspan> <tspan class="pl">}</tspan></text>
    <text x="38" y="172" class="ln m">4</text>
    <text x="38" y="192" class="ln m">5</text>  <text x="56" y="192" class="m"><tspan class="kw">compile</tspan> <tspan class="pl">{</tspan></text>
    <text x="38" y="216" class="ln m">6</text>  <text x="56" y="216" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">syn</tspan> <tspan class="err">sport</tspan> <tspan class="nm">51234</tspan> <tspan class="fl">dstport</tspan> <tspan class="nm">80</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="38" y="240" class="ln m">7</text>  <text x="56" y="240" class="m pl">    client <tspan class="ar">&lt;-</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">syn</tspan> <tspan class="fl">ack</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="38" y="264" class="ln m">8</text>  <text x="56" y="264" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">tcp</tspan> <tspan class="fl">ack</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">1ms</tspan></text>
    <text x="38" y="288" class="ln m">9</text>  <text x="56" y="288" class="m pl">    client <tspan class="ar">-&gt;</tspan> web <tspan class="pr">http</tspan> <tspan class="fl">get</tspan> <tspan class="fl">uri</tspan> <tspan class="st">"/healthz"</tspan> <tspan class="fl">hosthdr</tspan> <tspan class="st">"shop.example.com"</tspan> <tspan class="fl">wait</tspan> <tspan class="nm">2ms</tspan></text>
    <text x="38" y="312" class="ln m">10</text> <text x="56" y="312" class="m pl">    client <tspan class="ar">&lt;-</tspan> web <tspan class="pr">http</tspan> <tspan class="fl">status</tspan> <tspan class="nm">200</tspan> <tspan class="fl">reason</tspan> <tspan class="st">"OK"</tspan> <tspan class="fl">body</tspan> <tspan class="st">"ok"</tspan></text>
    <text x="38" y="336" class="ln m">11</text> <text x="56" y="336" class="m pl">}</text>
  </g>

  <!-- red wavy diagnostic squiggle under 'sport' on line 6 -->
  <path d="M 274 221 Q 278 217 282 221 T 290 221 T 298 221 T 306 221 T 316 221" fill="none" stroke="#f87171" stroke-width="2"/>

  <!-- live diagnostic + 1-click Quick Fix hover card (right side, zero code overlap) -->
  <line x1="316" y1="210" x2="646" y2="176" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="646" y="114" width="524" height="142" rx="8" fill="#252526" stroke="#454545" stroke-width="1.5"/>
  <rect x="646" y="114" width="524" height="4" rx="2" fill="#f87171"/>
  <text x="664" y="142" font-size="13" style="fill:#f87171;font-weight:700">× Unknown modifier 'sport'  (FrameAssembly)</text>
  <text x="664" y="166" font-size="12.5" style="fill:#d4d4d4">Help: Use 'srcport &lt;port&gt;' for the source port:</text>
  <text x="664" y="186" class="m" style="font-size:12.5px;fill:#9cdcfe">replace 'sport' with 'srcport'</text>
  <rect x="664" y="204" width="356" height="34" rx="5" fill="#0e639c"/>
  <text x="680" y="226" font-size="13" style="fill:#ffffff;font-weight:600">💡 Quick Fix (Ctrl+.) · Replace 'sport' with 'srcport'</text>

  <!-- integrated terminal panel -->
  <line x1="0" y1="410" x2="1200" y2="410" stroke="#3c3c3c" stroke-width="1.5"/>
  <rect x="0" y="411" width="1200" height="32" fill="#252526"/>
  <text x="24" y="431" class="th">PROBLEMS</text>
  <text x="124" y="431" class="th" style="fill:#ffffff">TERMINAL</text>
  <rect x="122" y="440" width="68" height="2" fill="#0ea5e9"/>

  <rect x="0" y="443" width="1200" height="177" fill="#181818"/>
  <g class="m" style="font-size:13px">
    <text x="24" y="468"><tspan style="fill:#4ade80">$</tspan> <tspan style="fill:#ffffff">frameassembly checkout_test.frasm</tspan></text>
    <text x="24" y="490" style="fill:#9cdcfe">Wrote checkout_test.pcap (5 packet(s), classic pcap)</text>
    <text x="24" y="516"><tspan style="fill:#4ade80">$</tspan> <tspan style="fill:#ffffff">frameassembly checkout_test.frasm checkout_test.pcapng</tspan></text>
    <text x="24" y="538" style="fill:#9cdcfe">Wrote checkout_test.pcapng (5 packet(s), pcapng)</text>
    <text x="24" y="564"><tspan style="fill:#4ade80">$</tspan> <tspan style="fill:#ffffff">frameassembly show checkout_test.frasm</tspan></text>
    <text x="24" y="586" style="fill:#9da5b4">#   Time (ms)   Source -&gt; Destination       Protocol   Bytes   Summary</text>
    <text x="24" y="606" style="fill:#d4d4d4">1   0.000       10.0.0.10 -&gt; 10.0.0.80      TCP        58      51234 -&gt; 80 [SYN] seq=1000</text>
  </g>

  <!-- status bar -->
  <rect x="0" y="620" width="1200" height="20" fill="#0ea5e9"/>
  <text x="16" y="634" font-size="11.5" style="fill:#ffffff;font-weight:600">FrameAssembly 3.1 · Syntax Highlighting &amp; Live WASM Linter</text>
  <text x="1184" y="634" text-anchor="end" font-size="11.5" style="fill:#ffffff">Restricted Mode &amp; vscode.dev Ready · .frasm</text>
</svg>
